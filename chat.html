<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 助手</title>
<style>
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; margin: 0; background: #f5f7fa; display: flex; flex-direction: column; height: 100vh; }
  header { background: #2563eb; color: #fff; padding: 12px 20px; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .model-picker { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 400; }
  #modelSel { padding: 6px 10px; border-radius: 8px; border: none; font-size: 14px; background: #fff; color: #1f2937; outline: none; cursor: pointer; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 12px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
  .assistant { align-self: flex-start; background: #fff; color: #1f2937; border: 1px solid #e5e7eb; border-bottom-left-radius: 4px; }
  .assistant.thinking { color: #6b7280; font-style: italic; }
  #input-row { display: flex; gap: 10px; padding: 14px; background: #fff; border-top: 1px solid #e5e7eb; }
  #msg { flex: 1; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; outline: none; }
  #send { padding: 0 22px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
  #send:disabled { background: #93c5fd; cursor: default; }
  #status { font-size: 12px; color: #dbeafe; }
</style>
</head>
<body>
  <header>
    <span>AI 助手</span>
    <div class="model-picker">
      <span>模型</span>
      <select id="modelSel">
        <option value="7b">Qwen2.5-7B</option>
        <option value="4b">Qwen3.5-4B（带思考）</option>
      </select>
      <span id="status"></span>
    </div>
  </header>
  <div id="chat"></div>
  <div id="input-row">
    <input id="msg" placeholder="输入消息，回车发送…" autocomplete="off">
    <button id="send">发送</button>
  </div>
<script>
// ========== 改成你自己的 Cloudflare Tunnel 地址 ==========
const API_BASE = "https://fax-ago-verbal-sunset.trycloudflare.com";
// =======================================================
let MODEL = "7b";
const messages = [];
const chat = document.getElementById("chat");
const msg = document.getElementById("msg");
const sendBtn = document.getElementById("send");
const modelSel = document.getElementById("modelSel");
const statusEl = document.getElementById("status");

function append(role, text, thinking) {
  const div = document.createElement("div");
  div.className = "msg " + role + (thinking ? " thinking" : "");
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

// 页面加载时获取当前模型
async function refreshStatus() {
  try {
    const r = await fetch(API_BASE + "/");
    const d = await r.json();
    if (d.current_model) {
      modelSel.value = d.current_model;
      MODEL = d.current_model;
      statusEl.textContent = "当前：" + d.model_name;
    } else {
      statusEl.textContent = "未加载";
    }
  } catch (e) {
    statusEl.textContent = "离线";
  }
}

modelSel.addEventListener("change", () => { MODEL = modelSel.value; });

async function send() {
  const text = msg.value.trim();
  if (!text || sendBtn.disabled) return;
  append("user", text);
  messages.push({ role: "user", content: text });
  msg.value = "";
  sendBtn.disabled = true;

  // 占位提示（首次切换到某模型会加载约 30 秒）
  const placeholder = append("assistant", "正在加载/切换模型，请稍候…", true);

  try {
    const resp = await fetch(API_BASE + "/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: MODEL, messages: messages, stream: false })
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const data = await resp.json();
    const reply = data.message.content;
    messages.push({ role: "assistant", content: reply });
    placeholder.textContent = reply;
    placeholder.classList.remove("thinking");
  } catch (e) {
    placeholder.textContent = "⚠️ 出错了：" + e.message + "（请确认你的电脑已开机、服务与隧道都在运行）";
    placeholder.classList.remove("thinking");
    messages.pop();  // 去掉失败的那条 user 消息，避免上下文错乱
  } finally {
    sendBtn.disabled = false;
    msg.focus();
    refreshStatus();
  }
}

sendBtn.addEventListener("click", send);
msg.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
refreshStatus();
</script>
</body>
</html>
