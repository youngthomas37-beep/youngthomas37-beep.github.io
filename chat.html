<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 助手</title>
<style>
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; margin: 0; background: #f5f7fa; display: flex; flex-direction: column; height: 100vh; }
  header { background: #2563eb; color: #fff; padding: 14px 20px; font-size: 18px; font-weight: 600; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 12px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
  .assistant { align-self: flex-start; background: #fff; color: #1f2937; border: 1px solid #e5e7eb; border-bottom-left-radius: 4px; }
  #input-row { display: flex; gap: 10px; padding: 14px; background: #fff; border-top: 1px solid #e5e7eb; }
  #msg { flex: 1; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; outline: none; }
  #send { padding: 0 22px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
  #send:disabled { background: #93c5fd; cursor: default; }
</style>
</head>
<body>
  <header>AI 助手</header>
  <div id="chat"></div>
  <div id="input-row">
    <input id="msg" placeholder="输入消息，回车发送…" autocomplete="off">
    <button id="send">发送</button>
  </div>
<script>
// ========== 改成你自己的 Cloudflare Tunnel 地址 ==========
const API_BASE = "https://floyd-roughly-paradise-nuke.trycloudflare.com";
// =======================================================
const MODEL = "qwen2.5:7b";
const messages = [];
const chat = document.getElementById("chat");
const msg = document.getElementById("msg");
const sendBtn = document.getElementById("send");

function append(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function send() {
  const text = msg.value.trim();
  if (!text || sendBtn.disabled) return;
  append("user", text);
  messages.push({ role: "user", content: text });
  msg.value = "";
  sendBtn.disabled = true;
  try {
    const resp = await fetch(API_BASE + "/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: MODEL, messages: messages, stream: false })
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const data = await resp.json();
    const reply = data.message.content;
    messages.push({ role: "assistant", content: reply });
    append("assistant", reply);
  } catch (e) {
    append("assistant", "⚠️ 出错了：" + e.message + "（请确认你的电脑已开机、Ollama 与隧道都在运行）");
  } finally {
    sendBtn.disabled = false;
    msg.focus();
  }
}

sendBtn.addEventListener("click", send);
msg.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
</script>
</body>
</html>
